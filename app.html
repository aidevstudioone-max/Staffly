<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staffly — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg style="display:none">
  <symbol id="icon-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 14.3c2.7.3 5 2.4 5 5.7"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6"/></symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
  <symbol id="icon-briefcase" viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="19" height="12.5" rx="2"/><path d="M8 7.5V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5M2.5 13h19"/></symbol>
  <symbol id="icon-back" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="icon-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<div id="toast"></div>

<header class="app-topbar">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="brand-mark">S</span> Staffly</a>
    <nav class="app-tabs" id="appTabs">
      <button class="app-tab active" data-view="dashboard">Dashboard</button>
      <button class="app-tab" data-view="directory">Directory</button>
      <button class="app-tab" data-view="attendance">Attendance</button>
      <button class="app-tab" data-view="leave">Leave Requests</button>
    </nav>
    <a href="index.html" class="back-link"><svg class="icon"><use href="#icon-back"/></svg> Back to site</a>
  </div>
</header>

<main class="app-main">
  <div class="wrap">

    <section id="view-dashboard" class="view active">
      <div class="view-head">
        <div><h2>Dashboard</h2><p>A quick read on your team, right now.</p></div>
      </div>
      <div class="stat-strip" id="dashStats"></div>
      <div class="panel">
        <div class="panel-head"><h3>Pending leave requests</h3></div>
        <div id="dashLeavePreview"></div>
      </div>
    </section>

    <section id="view-directory" class="view">
      <div class="view-head">
        <div><h2>Directory</h2><p>Every employee, at a glance.</p></div>
      </div>
      <div class="toolbar">
        <div class="filter-pills" id="deptFilters"></div>
        <button class="btn btn-primary btn-sm" id="toggleAddForm"><svg class="icon"><use href="#icon-plus"/></svg> Add Employee</button>
      </div>
      <div class="form-panel" id="addForm">
        <h3>Add a new employee</h3>
        <form id="employeeForm">
          <div class="form-grid">
            <div class="field"><label for="empName">Full name</label><input type="text" id="empName" required></div>
            <div class="field"><label for="empRole">Role</label><input type="text" id="empRole" required></div>
            <div class="field">
              <label for="empDept">Department</label>
              <select id="empDept" required>
                <option value="Engineering">Engineering</option>
                <option value="Sales">Sales</option>
                <option value="Design">Design</option>
                <option value="Operations">Operations</option>
              </select>
            </div>
            <div class="field"><label for="empEmail">Email</label><input type="email" id="empEmail" required></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline btn-sm" id="cancelAddForm">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm">Add Employee</button>
          </div>
        </form>
      </div>
      <div class="employee-grid" id="employeeGrid"></div>
    </section>

    <section id="view-attendance" class="view">
      <div class="view-head">
        <div><h2>Attendance</h2><p>This week, click a status pill to change it.</p></div>
      </div>
      <p class="att-hint" id="attWeekLabel"></p>
      <div class="panel"><div class="table-wrap"><table class="attendance" id="attendanceTable"></table></div></div>
    </section>

    <section id="view-leave" class="view">
      <div class="view-head">
        <div><h2>Leave Requests</h2><p>Request time off, and review pending requests.</p></div>
      </div>
      <div class="leave-layout">
        <div class="panel" style="padding:22px">
          <h3 style="font-size:1rem; margin-bottom:16px">New request</h3>
          <form id="leaveForm">
            <div class="field" style="margin-bottom:14px">
              <label for="leaveEmp">Employee</label>
              <select id="leaveEmp" required></select>
            </div>
            <div class="form-grid" style="margin-bottom:14px">
              <div class="field"><label for="leaveStart">Start date</label><input type="date" id="leaveStart" required></div>
              <div class="field"><label for="leaveEnd">End date</label><input type="date" id="leaveEnd" required></div>
            </div>
            <div class="field" style="margin-bottom:16px">
              <label for="leaveReason">Reason</label>
              <textarea id="leaveReason" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Submit Request</button>
          </form>
        </div>
        <div class="leave-list" id="leaveList"></div>
      </div>
    </section>

  </div>
</main>

<script src="app.js"></script>
</body>
</html>
